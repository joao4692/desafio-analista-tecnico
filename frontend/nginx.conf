server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Mesmo papel do proxy.conf.json no dev: o front e a API ficam no mesmo endereço,
    # então o navegador não precisa de CORS. "backend" é o nome do serviço no compose.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Os .js e .css do build têm hash no nome: podem ficar em cache por muito tempo.
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rotas do Angular (/usuarios/3, /cartoes/novo...) não são arquivos:
    # tudo que não existe cai no index.html e o router resolve no navegador.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
