<div class="d-flex align-items-center justify-content-between gap-2 mb-3">
  <h1 class="h4 mb-0">Cartões</h1>
  <a class="btn btn-primary" routerLink="/cartoes/novo">Novo cartão</a>
</div>

<div class="mb-3">
  <label for="filtro-usuario" class="form-label">Usuário</label>
  <select id="filtro-usuario" class="form-select" (change)="filtrar($event)">
    <option value="">Todos</option>
    @for (usuario of usuarios(); track usuario.id) {
      <option [value]="usuario.id">{{ usuario.nome }}</option>
    }
  </select>
</div>

@if (carregando()) {
  <p class="text-body-secondary">Carregando...</p>
} @else {
  @for (cartao of cartoes(); track cartao.id) {
    <div class="card mb-2">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start gap-2">
          <div>
            <h2 class="h6 card-title mb-1">{{ cartao.nome }}</h2>
            <p class="card-text text-body-secondary mb-1">Nº {{ cartao.numeroCartao }}</p>
            <p class="card-text small mb-0">{{ nomeDoDono(cartao) }}</p>
          </div>
          <span class="badge text-bg-info">{{ rotuloTipo[cartao.tipoCartao] }}</span>
        </div>

        <div class="d-flex align-items-center justify-content-between gap-2 mt-3">
          <div class="form-check form-switch mb-0">
            <input
              class="form-check-input"
              type="checkbox"
              role="switch"
              [id]="'status-' + cartao.id"
              [checked]="cartao.status"
              (change)="alternarStatus(cartao, $event)"
            />
            <label class="form-check-label" [for]="'status-' + cartao.id">
              {{ cartao.status ? 'Ativo' : 'Inativo' }}
            </label>
          </div>
          <button type="button" class="btn btn-outline-danger" (click)="remover(cartao)">
            Remover
          </button>
        </div>
      </div>
    </div>
  } @empty {
    <p class="text-body-secondary">Nenhum cartão encontrado.</p>
  }
}
